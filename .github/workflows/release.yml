name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick release notes
        run: |
          # 优先用 release-notes/<tag>.md 里手写的说明（讲功能，不讲 commit）；
          # 没有就按提交自动生成，保证不会空着。
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## 变更"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty=format:'- %s（%h）' "$prev..$GITHUB_REF_NAME"
            else
              git log --no-merges --pretty=format:'- %s（%h）' "$GITHUB_REF_NAME"
            fi
            if [ -n "$prev" ]; then
              echo
              echo
              echo "完整对比：https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            fi
          } > notes.md
          curated="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$curated" ]; then
            cp "$curated" notes.md
            echo "使用手写说明：$curated"
          fi
          cat notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
